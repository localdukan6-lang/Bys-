
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Worker Registration | BYS ASSOCIATE JOB</title>

    <meta name="description" content="Register yourself with BYS ASSOCIATE JOB for employment opportunities.">

    <link rel="stylesheet" href="worker-registration.css">
</head>

<body>

<header class="header">
    <div class="brand">
        <h2>BYS ASSOCIATE JOB</h2>
        <p>Worker Registration Portal</p>
    </div>

    <a href="index.html" class="home-btn">Home</a>
</header>

<main class="container">

    <section class="form-card">

        <div class="form-heading">
            <h1>Worker Registration</h1>
            <p>अपनी जानकारी भरें और BYS ASSOCIATE JOB के साथ रजिस्टर करें।</p>
        </div>

        <div class="notice">
            कृपया सभी जरूरी जानकारी सही-सही भरें।
        </div>

        <form id="workerForm">

            <h3>Personal Information</h3>

            <div class="form-grid">

                <div class="field">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your full name"
                           maxlength="100" required>
                </div>

                <div class="field">
                    <label for="mobile">Mobile Number *</label>
                    <input type="tel" id="mobile" name="mobile"
                           placeholder="10 digit mobile number"
                           inputmode="numeric"
                           maxlength="10"
                           pattern="[6-9][0-9]{9}"
                           autocomplete="tel"
                          required>
                </div>

                <div class="field">
                    <label for="whatsapp">WhatsApp Number</label>
                    <input type="tel" id="whatsapp" name="whatsapp"
                           placeholder="WhatsApp number"
                           inputmode="numeric"
                           maxlength="10">
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="example@gmail.com"
                           maxlength="150">
                </div>

            </div>

            <h3>Address Information</h3>

            <div class="form-grid">

                <div class="field">
                    <label for="state">State *</label>
                    <input type="text" id="state" name="state"
                           placeholder="Enter state"
                           value="Uttar Pradesh" required>
                </div>

                <div class="field">
                    <label for="district">District *</label>
                    <input type="text" id="district" name="district"
                           placeholder="Enter district" required>
                </div>

                <div class="field full">
                    <label for="address">Full Address *</label>
                    <textarea id="address" name="address"
                              placeholder="Village, Post, Tehsil, PIN Code"
                              maxlength="500" required></textarea>
                </div>

            </div>

            <h3>Education & Work Information</h3>

            <div class="form-grid">

                <div class="field">
                    <label for="qualification">Qualification *</label>
                    <select id="qualification" name="qualification" required>
                        <option value="">Select Qualification</option>
                        <option>Uneducated</option>
                        <option>5th Pass</option>
                        <option>8th Pass</option>
                        <option>10th Pass</option>
                        <option>12th Pass</option>
                        <option>ITI</option>
                        <option>Diploma</option>
                        <option>Graduate</option>
                        <option>B.A</option>
                        <option>B.Com</option>
                        <option>B.Sc</option>
                        <option>B.Tech</option>
                        <option>Post Graduate</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="experience">Work Experience *</label>
                    <select id="experience" name="experience" required>
                        <option value="">Select Experience</option>
                        <option>Fresher</option>
                        <option>Less than 1 Year</option>
                        <option>1-2 Years</option>
                        <option>2-5 Years</option>
                        <option>5-10 Years</option>
                        <option>More than 10 Years</option>
                    </select>
                </div>

                <div class="field full">
                    <label for="workType">Work Type *</label>
                    <select id="workType" name="workType" required>
                        <option value="">Select Work Type</option>
                        <option>Private Job</option>
                        <option>Government Job</option>
                        <option>Factory Job</option>
                        <option>Office Job</option>
                        <option>Computer Operator</option>
                        <option>Data Entry</option>
                        <option>Sales & Marketing</option>
                        <option>Technician</option>
                        <option>Electrician</option>
                        <option>Driver</option>
                        <option>Helper</option>
                        <option>Work From Home</option>
                        <option>Any Suitable Job</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="field full">
                    <label for="message">Additional Information</label>
                    <textarea id="message" name="message"
                              placeholder="Write your skills, preferred location or other details..."
                              maxlength="1000"></textarea>
                </div>

            </div>

            <div class="consent">
                <input type="checkbox" id="consent" required>
                <label for="consent">
                    मैं पुष्टि करता/करती हूँ कि मेरे द्वारा दी गई जानकारी सही है
                    और BYS ASSOCIATE JOB इसे नौकरी से संबंधित संपर्क के लिए इस्तेमाल कर सकता है।
                </label>
            </div>

            <button type="submit" id="submitBtn">
                Submit Registration
            </button>

            <div id="formMessage" role="status" aria-live="polite"></div>

        </form>

    </section>

</main>

<footer>
    <p>© <span id="year"></span> BYS ASSOCIATE JOB. All Rights Reserved.</p>
</footer>

<script src="worker-registration.js"></script>

</body>
</html>
